<!DOCTYPE html>
<html lang="fr" layout:decorate="~{decorators/master}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Vols</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f7fc;
            color: #333;
        }

        header,
        footer {
            background: #3498db;
            color: white;
            text-align: center;
            padding: 20px;
        }

        section {
            padding: 40px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-form input,
        .search-form select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-filter,
        .btn-nav {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-filter:hover,
        .btn-nav:hover {
            background: #2980b9;
        }

        .reset-link {
            align-self: center;
            color: #3498db;
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #696969;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .img-preview {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .no-results {
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <header>
        <h1>Trouvez votre prochain voyage</h1>
    </header>

    <section>
        <div class="search-container">
            <form th:action="@{/}" method="get" class="search-form">
                <label>Départ
                    <input type="text" name="origin" th:value="${origin}" placeholder="Départ (IATA)">
                </label>
                <label>Destination
                    <input type="text" name="destination" th:value="${destination}" placeholder="Destination (IATA)">
                </label>

                <label> Prix
                    <select name="sortPrice">
                        <option value="asc" th:selected="${sortPrice == 'asc'}">Prix croissant</option>
                        <option value="desc" th:selected="${sortPrice == 'desc'}">Prix décroissant</option>
                    </select>
                </label>

                <button type="submit" class="btn-filter">Filtrer les vols</button>
                <a th:href="@{/}" class="reset-link">Réinitialiser</a>
            </form>
        </div>

        <table class="flight-table">
            <thead>
            <tr>
                <th>Départ</th>
                <th>Arrivée</th>
                <th>Prix</th>
                <th>Destination</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="flight : ${flights}">
                <td th:text="${flight.origin.name + ' (' + flight.origin.iata + ')'}"></td>
                <td th:text="${flight.destination.name + ' (' + flight.destination.iata + ')'}"></td>
                <td>
                    <span class="price-tag" th:text="${#numbers.formatDecimal(flight.price, 1, 2)} + ' €'"></span>
                </td>
                <td>
                    <img th:src="${flight.image}" class="img-preview" alt="Destination image">
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(flights)}">
                <td colspan="4" class="no-results">Aucun vol ne correspond à vos critères de recherche.</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <a th:if="${currentPage > 0}"
               th:href="@{/(page=${currentPage - 1}, origin=${origin}, destination=${destination}, sortPrice=${sortPrice})}"
               class="btn-nav">« Précédent</a>

            <span class="current-page" th:text="'Page ' + (${currentPage} + 1)">Page 1</span>

            <a th:if="${not #lists.isEmpty(flights) and #lists.size(flights) == 6}"
               th:href="@{/(page=${currentPage + 1}, origin=${origin}, destination=${destination}, sortPrice=${sortPrice})}"
               class="btn-nav">Suivant »</a>
        </div>
    </section>
</div>
<footer>
    <p>&copy; 2023 Recherche de Vols. Tous droits réservés.</p>
</footer>
</body>
</html>
